name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack
      # 只保留固定文件名附件（latest 链接无需知道版本号）
      - run: mv dsh-msg-index-*.tgz dsh-msg-index.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'dsh-msg-index.tgz'
          generate_release_notes: true